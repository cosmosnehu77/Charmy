# Cuando entra a main un cambio de lockfile, los PR abiertos que quedan en conflicto SOLO por pnpm-lock.yaml o
# uv.lock se arreglan solos con tools/al-dia (la copia de main, que no corre scripts de instalación). Si el conflicto
# es real, se avisa en el PR mencionando a quien lo abrió. Decisión D-24 de PLAN.md.
name: Lockfiles al día

on:
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, uv.lock]
  workflow_dispatch:

permissions:
  contents: write        # pushear el merge de main a la rama del PR
  pull-requests: write   # comentar en el PR
  actions: write         # volver a correr el CI: un push hecho con GITHUB_TOKEN no lo dispara solo

concurrency:
  group: al-dia
  cancel-in-progress: false

jobs:
  prs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Poner al día los PR abiertos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cp tools/al-dia "$RUNNER_TEMP/al-dia"   # siempre la versión de main, nunca la de la rama del PR
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh pr list --base main --state open --limit 100 \
            --json number,headRefName,isCrossRepository,author \
            -q '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName) \(.author.login)"' > prs.txt
          while read -r n rama autor; do
            git checkout -q -B "$rama" "origin/$rama" || continue
            if git merge-tree --write-tree origin/main HEAD > /dev/null 2>&1; then
              echo "#$n: fusiona limpio, no se toca"; continue
            fi
            if "$RUNNER_TEMP/al-dia" > salida.txt 2>&1 && git push -q origin "HEAD:$rama"; then
              echo "#$n: lockfiles resueltos"
              gh workflow run ci.yml --ref "$rama" || echo "::warning::#$n: no se pudo volver a correr el CI"
              gh workflow run pruebas.yml --ref "$rama" || echo "::warning::#$n: no se pudieron volver a correr las pruebas"
              gh pr comment "$n" --body "Traje \`main\` a esta rama y regeneré los lockfiles con \`tools/al-dia\`: el conflicto era solo de \`pnpm-lock.yaml\` o \`uv.lock\`. Antes de seguir: \`git pull\`." || true
            else
              echo "#$n: conflicto real"; cat salida.txt
              archivos="$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')"
              git merge --abort 2> /dev/null || true
              gh pr comment "$n" --body "@$autor este PR tiene conflictos con \`main\` que no son solo de lockfiles. Correr \`tools/al-dia\` en la rama, resolver a mano lo que quede y pushear.
          ${archivos}" || true
            fi
            git reset -q --hard
          done < prs.txt
