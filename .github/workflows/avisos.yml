# Servicio de avisos (services/alertas, F3-A1): una corrida cada 5 minutos, gratis en un repo público.
# Cada corrida guarda los estados de los botones tocados desde la anterior (PATCH /alerts) y manda los avisos de
# focos y reportes nuevos de cada zona, al grupo de esa zona (D-39). No guarda nada entre corridas: POST /alerts
# dice si un aviso ya se mandó.
# Secretos del repo: TELEGRAM_BOT_TOKEN, CHARMY_SERVICE_TOKEN (el mismo que la API) y TELEGRAM_ZONAS, un JSON
# {zona: grupo}; sin TELEGRAM_ZONAS, la zona de demostración va al grupo de TELEGRAM_CHAT_ID.
# Variable opcional: CHARMY_API_URL (sin /api/v1).
# A mano, con la opción "prueba", manda a cada grupo un aviso de prueba (sin botones ni API, #303).
# Si una corrida falla y la anterior había salido bien, abre el issue "Bot de avisos caído" asignado a quien
# atiende el bot (variable RESPONSABLE_AVISOS, por defecto dimidio6); cuando vuelve a andar, lo cierra.
# Con el secreto TELEGRAM_WEBHOOK_SECRET, los botones van por el webhook a la API (D-41) y la corrida no los lee.
# A mano, con la opción "webhook", registra el webhook en Telegram (una vez, después de cargar el secreto).
name: Avisos

on:
  schedule:
    # Minutos no redondos: GitHub demora o saltea los cron de los minutos más pedidos (0, 15, 30, 45).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: Mandar un aviso de prueba al grupo (sin botones, no toca la API)
        type: boolean
        default: false
      webhook:
        description: Registrar el webhook de Telegram para los botones (D-41); no manda avisos
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # abrir y cerrar el issue "Bot de avisos caído"

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  corrida:
    runs-on: ubuntu-latest
    # /live y el viento pueden tardar hasta 120 s cada uno con la API despertándose (D-37).
    timeout-minutes: 10
    env:
      HAY_SECRETOS: >-
        ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.CHARMY_SERVICE_TOKEN != ''
        && (secrets.TELEGRAM_ZONAS != '' || secrets.TELEGRAM_CHAT_ID != '') }}
    steps:
      - name: Aviso si faltan secretos
        if: env.HAY_SECRETOS != 'true'
        run: >-
          echo "::warning::Faltan TELEGRAM_BOT_TOKEN, CHARMY_SERVICE_TOKEN o el grupo (TELEGRAM_ZONAS o
          TELEGRAM_CHAT_ID); los avisos no corren."
      - uses: actions/checkout@v7
        if: env.HAY_SECRETOS == 'true'
      - uses: astral-sh/setup-uv@v10.3.3
        if: env.HAY_SECRETOS == 'true'
        with:
          enable-cache: true
      - name: Una corrida de los avisos
        if: env.HAY_SECRETOS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ZONAS: ${{ secrets.TELEGRAM_ZONAS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CHARMY_SERVICE_TOKEN: ${{ secrets.CHARMY_SERVICE_TOKEN }}
          CHARMY_API_URL: ${{ vars.CHARMY_API_URL || 'https://charmy-j36m.onrender.com' }}
        # Los tokens no se imprimen; si apareciera uno, GitHub tapa los secretos en el registro.
        run: >-
          uv run --package alertas python -m alertas
          ${{ inputs.prueba && '--prueba' || '' }} ${{ inputs.webhook && '--webhook' || '' }}
      - name: Avisar si el bot empieza a fallar
        # Una vez por caída: si el issue ya está abierto, no se suma nada.
        if: failure() && !inputs.prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESPONSABLE: ${{ vars.RESPONSABLE_AVISOS || 'dimidio6' }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Bot de avisos caído"
          abierto="$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$abierto" ]; then
            gh issue create --title "$titulo" --assignee "$RESPONSABLE" --label carril-a \
              --body "Falló una corrida del bot de avisos: $CORRIDA. Mientras siga así, las entidades no reciben avisos. Este issue se cierra solo cuando una corrida vuelve a salir bien."
          fi
      - name: Cerrar el aviso de caída si el bot volvió
        if: success() && env.HAY_SECRETOS == 'true' && !inputs.prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierto="$(gh issue list --state open --search '"Bot de avisos caído" in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$abierto" ]; then
            gh issue close "$abierto" --comment "El bot volvió a andar: $CORRIDA"
          fi
