# CI de JavaScript: solo corre si cambió algo de apps/ o packages/, y solo sobre los paquetes tocados
# y los que dependen de ellos (filtro de Turborepo).
name: CI JavaScript

on:
  pull_request:
    paths: &rutas
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci-js.yml"
  push:
    branches: [main]
    paths: *rutas

permissions:
  contents: read

concurrency:
  group: ci-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, tipos, pruebas y compilación de lo que cambió
        env:
          DESDE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # El primer push de una rama no tiene "before": se compara contra el commit anterior.
          if ! git cat-file -e "$DESDE^{commit}" 2>/dev/null; then DESDE=HEAD^; fi
          pnpm turbo run lint typecheck test build --filter="...[$DESDE]"
