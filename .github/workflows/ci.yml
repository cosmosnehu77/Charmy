# CI de todo el monorepo. Corre solo lo que cambió y termina con "CI ok", que es el chequeo obligatorio de main.
# "CI ok" siempre corre: si una parte no cambió, cuenta como aprobada. Así un PR que solo toca Python no queda
# esperando un chequeo de JavaScript que nunca va a llegar. Reglas de pruebas: docs/PRUEBAS.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.ver.outputs.js }}
      python: ${{ steps.ver.outputs.python }}
      humo: ${{ steps.ver.outputs.humo }}
      desde: ${{ steps.ver.outputs.desde }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ver
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # El primer push de una rama no tiene "before": se compara contra el commit anterior.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD^; fi
          echo "desde=$BASE" >> "$GITHUB_OUTPUT"
          archivos="$(git diff --name-only "$BASE"...HEAD)"
          echo "$archivos"
          tocado() { printf '%s\n' "$archivos" | grep -qE "$1" && echo true || echo false; }
          echo "js=$(tocado '^(apps/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "python=$(tocado '^(services/|infra/|pyproject\.toml$|uv\.lock$|\.python-version$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "humo=$(tocado '^(infra/humo/|packages/contracts/api/openapi\.yaml$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  js:
    needs: cambios
    if: needs.cambios.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos, pruebas y compilación de lo que cambió y de lo que depende de eso
        run: pnpm turbo run lint typecheck test build --filter="...[${{ needs.cambios.outputs.desde }}]"

  python:
    needs: cambios
    if: needs.cambios.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv no publica la etiqueta de versión mayor (v10): se fija la versión exacta.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check services infra
      - name: Pruebas
        # pytest sale con 5 cuando no encuentra pruebas. Eso es un error: todo servicio tiene pruebas (RNF-15).
        run: uv run pytest services infra

  humo:
    # La prueba de humo contra el mock del contrato: si el contrato cambia y la prueba ya no lo cumple
    # (o al revés), falla acá y no el día del despliegue. Después de cada despliegue corre en deploy-api.yml.
    needs: cambios
    if: needs.cambios.outputs.humo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Levantar el mock (Prism, puerto 4010)
        run: |
          pnpm --filter @charmy/contracts-api mock > prism.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://localhost:4010/health > /dev/null && exit 0; sleep 1; done
          cat prism.log; echo "::error::El mock no arrancó"; exit 1
      - name: Prueba de humo contra el mock
        run: uv run --package humo python -m humo http://localhost:4010

  ok:
    name: CI ok
    if: always()
    needs: [cambios, js, python, humo]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todo lo que corrió pasó
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            case "$r" in success|skipped) ;; *) echo "::error::Algún chequeo falló o se canceló"; exit 1;; esac
          done
