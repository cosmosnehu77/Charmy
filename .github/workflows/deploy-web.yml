# Despliegue de landing, app y juego en Cloudflare Pages al entrar cambios en main.
# Cada pieza se salta sola si su carpeta todavía no existe o si faltan los secretos de Cloudflare.
# Secretos del repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Variable del repo: VITE_API_URL.
name: Despliegue web

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read   # leer el resultado de "CI ok"

jobs:
  ci:
    # Nunca se publica un commit con el CI en rojo (D-29): espera el chequeo "CI ok" de este mismo commit.
    # Si un push más nuevo canceló ese CI, este despliegue falla y lo hace el del commit nuevo.
    name: Esperar CI ok
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: El CI de este commit pasó
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 85); do
            r="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=CI%20ok" \
                  --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"' || true)"
            case "$r" in
              "completed success") echo "CI ok en verde"; exit 0 ;;
              completed*) echo "::error::CI ok terminó en '${r#completed }': no se despliega $SHA"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::CI ok no terminó en 28 minutos: no se despliega $SHA"; exit 1

  pages:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-web-${{ matrix.pieza }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pieza: [landing, app, juego]
    env:
      HAY_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: ¿Existe la pieza?
        id: existe
        run: |
          if [ -f "apps/${{ matrix.pieza }}/package.json" ]; then echo "si=true" >> "$GITHUB_OUTPUT"
          else echo "apps/${{ matrix.pieza }} todavía no existe: se salta."; echo "si=false" >> "$GITHUB_OUTPUT"; fi
      - name: Aviso si faltan secretos
        if: steps.existe.outputs.si == 'true' && env.HAY_CLOUDFLARE != 'true'
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se despliega ${{ matrix.pieza }}."
      - uses: pnpm/action-setup@v6
        if: steps.existe.outputs.si == 'true' && env.HAY_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v7
        if: steps.existe.outputs.si == 'true' && env.HAY_CLOUDFLARE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Compilar
        if: steps.existe.outputs.si == 'true' && env.HAY_CLOUDFLARE == 'true'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@charmy/${{ matrix.pieza }}"
      # Sin cloudflare/wrangler-action: instala wrangler con pnpm en la raíz del workspace y pnpm lo rechaza
      # (ERR_PNPM_ADDING_TO_ROOT). npx lo baja a su caché sin tocar node_modules ni el lockfile.
      - name: Publicar en Cloudflare Pages
        if: steps.existe.outputs.si == 'true' && env.HAY_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROYECTO: charmy-${{ matrix.pieza }}
        run: |
          npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch main || true
          npx --yes wrangler@4 pages deploy "apps/${{ matrix.pieza }}/dist" --project-name "$PROYECTO" --branch main
