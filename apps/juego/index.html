<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Charmy Brigada: apagá los focos de calor que vieron los satélites en un día real del sur de Argentina y Chile." />
    <meta name="theme-color" content="#1b2430" />
    <title>Charmy Brigada</title>
  </head>
  <body>
    <main id="juego" aria-label="Charmy Brigada: focos de calor de un día real"></main>
    <div id="herramientas" class="herramientas" role="toolbar" aria-label="Herramientas de Charmy" hidden>
      <button type="button" data-herramienta="bombero" aria-pressed="true"><kbd>1</kbd> Agua</button>
      <button type="button" data-herramienta="piloto" aria-pressed="false"><kbd>2</kbd> Avión</button>
      <button type="button" data-herramienta="cientifica" aria-pressed="false"><kbd>3</kbd> Verificar</button>
      <button type="button" data-herramienta="guia" aria-pressed="false"><kbd>4</kbd> Cortafuegos</button>
    </div>
    <footer class="pie">
      <nav aria-label="Otras partes de Charmy">
        <a href="https://charmy-landing.pages.dev">Qué es Charmy</a>
        <a href="https://charmy-app.pages.dev">Abrir el mapa</a>
        <button type="button" id="silencio" class="silencio" aria-pressed="false">Sonido: sí</button>
      </nav>
      <p>Charmy no reemplaza a los servicios de emergencia. Si ves fuego, llamá al 100 en Argentina o al 132 en Chile.</p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
