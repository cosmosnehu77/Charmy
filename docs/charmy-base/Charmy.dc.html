<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","saluda","explica","alerta","festeja","pensando"],"default":"idle"},"outfit":{"editor":"enum","options":["base","bombero","piloto","cientifica","guia"],"default":"base"},"size":{"editor":"int","min":32,"max":640,"default":240},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood ?? 'idle';
    var outfit = this.props.outfit ?? 'base';
    var size = this.props.size ?? 240;
    var is = function (m) { return mood === m ? 1 : 0; };
    var any = function () { return Array.prototype.indexOf.call(arguments, mood) >= 0 ? 1 : 0; };
    var of = function (x) { return outfit === x ? 1 : 0; };
    var o = {
      armL: any('idle', 'saluda', 'explica', 'alerta', 'pensando'),
      armR: any('idle', 'alerta'),
      armLUp: is('festeja'),
      armRUp: any('saluda', 'festeja'),
      armRPoint: is('explica'),
      armChin: is('pensando'),
      eyesOpen: any('idle', 'saluda', 'explica'),
      eyesHappy: is('festeja'),
      eyesAlert: is('alerta'),
      eyesThink: is('pensando'),
      mouthW: any('idle', 'pensando'),
      mouthOpen: any('saluda', 'explica'),
      mouthBig: is('festeja'),
      mouthO: is('alerta'),
      alert: is('alerta'),
      think: is('pensando'),
      sparkle: is('festeja'),
      wave: is('saluda'),
      speech: is('explica'),
      bombero: of('bombero'),
      piloto: of('piloto'),
      cientifica: of('cientifica'),
      guia: of('guia'),
      belly: (outfit === 'base' || outfit === 'piloto' || outfit === 'guia') ? 1 : 0
    };
    return { o: o, size: size, label: 'Charmy, estado ' + mood + ', vestuario ' + outfit };
  }
}
</script>
