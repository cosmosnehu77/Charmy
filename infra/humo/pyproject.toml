[project]
name = "humo"
version = "0.1.0"
description = "Prueba de humo de la API de Charmy contra cualquier URL: /health, /calendar y el CSV de /hotspots."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humo"]
