[project]
name = "publicar"
version = "0.1.0"
description = "Publica los datos precalculados de Charmy como una versión (release) de GitHub con su manifiesto."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publicar"]
