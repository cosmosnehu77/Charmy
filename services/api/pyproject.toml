[project]
name = "api"
version = "0.1.0"
description = "Carril C: API REST de Charmy (/api/v1), implementa packages/contracts/api/openapi.yaml"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
