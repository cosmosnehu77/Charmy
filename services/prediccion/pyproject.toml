[project]
name = "prediccion"
version = "0.1.0"
description = "Predicción a 1-3 meses: TimesFM 2.5 contra LightGBM con la compuerta D-10 (F3-E3, D-31)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pipeline",
    "polars>=2.1.0",
]

[project.optional-dependencies]
# Pesado (torch): no se instala con `uv sync --all-packages`. Solo para correr la comparación real:
# uv run --package prediccion --extra timesfm python -m prediccion ...
timesfm = ["timesfm[torch]==3.0.2"]

[tool.uv.sources]
pipeline = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
