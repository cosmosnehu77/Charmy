[project]
name = "worker"
version = "0.1.0"
description = "Carril C: worker de focos recientes de FIRMS (VIIRS NOAA-20 y NOAA-21 NRT) para /live"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
